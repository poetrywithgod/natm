<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16233D" />
    <title>You're offline — NATM</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        background: #16233D;
        color: #F6F3EA;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px 24px;
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 20px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
        color: #F6F3EA;
      }
      p {
        margin: 0 0 24px;
        color: #C3CCE0;
        max-width: 320px;
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: none;
        background: #B8E14A;
        color: #16233D;
        font-size: 1rem;
        font-weight: 700;
        padding: 12px 28px;
        border-radius: 999px;
        cursor: pointer;
      }
      button:active { filter: brightness(0.9); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/icons/icon-192.png" alt="NATM" />
      <h1>You're offline</h1>
      <p>This page needs an internet connection. Reconnect and try again — nothing you've done has been lost.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
